name: Deploy - K-SNS production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact protected main commit to release"
        required: true
        type: string
      confirmation:
        description: "Type deploy-kariya-sns-production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kariya-sns-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, kariya-production, kariya-sns-deploy]
    environment: kariya-sns-production
    timeout-minutes: 30
    env:
      DEPLOY_HOST: "${{ vars.KARIYA_SNS_DEPLOY_HOST }}"
      DEPLOY_USER: "${{ vars.KARIYA_SNS_DEPLOY_USER }}"
      SERVICE_PATH: "${{ vars.KARIYA_SNS_SERVICE_PATH }}"
      SERVICE_NAME: "${{ vars.KARIYA_SNS_SERVICE_NAME }}"
      SYSTEMD_UNIT: "${{ vars.KARIYA_SNS_SYSTEMD_UNIT }}"
      DEPLOY_KEY_PATH: "${{ vars.KARIYA_SNS_DEPLOY_KEY_PATH }}"
      KNOWN_HOSTS_PATH: "${{ vars.KARIYA_SNS_KNOWN_HOSTS_PATH }}"
      KNOWN_HOSTS_SHA256: "${{ vars.KARIYA_SNS_KNOWN_HOSTS_SHA256 }}"
      EXPECTED_RUNNER_NAME: "${{ vars.KARIYA_SNS_RUNNER_NAME }}"
      RUNNER_ATTESTATION_PATH: "${{ vars.KARIYA_SNS_RUNNER_ATTESTATION_PATH }}"
      RUNNER_ATTESTATION_SHA256: "${{ vars.KARIYA_SNS_RUNNER_ATTESTATION_SHA256 }}"
      REMOTE_ENV_PATH: "${{ vars.KARIYA_SNS_PROTECTED_ENV_PATH }}"

    steps:
      - name: Confirm exact protected release
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "deploy-kariya-sns-production"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "${{ inputs.release_sha }}" =~ ^[0-9a-f]{40}$ ]]
          test "${{ inputs.release_sha }}" = "$GITHUB_SHA"
          for name in DEPLOY_HOST DEPLOY_USER SERVICE_PATH SERVICE_NAME SYSTEMD_UNIT DEPLOY_KEY_PATH KNOWN_HOSTS_PATH KNOWN_HOSTS_SHA256 EXPECTED_RUNNER_NAME RUNNER_ATTESTATION_PATH RUNNER_ATTESTATION_SHA256 REMOTE_ENV_PATH; do
            test -n "${!name:-}" || { echo "Protected deployment configuration is unavailable."; exit 1; }
          done
          test "$RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$SERVICE_NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$SYSTEMD_UNIT" =~ ^[a-zA-Z0-9_.@-]+\.service$ ]]
          for path in SERVICE_PATH DEPLOY_KEY_PATH KNOWN_HOSTS_PATH RUNNER_ATTESTATION_PATH REMOTE_ENV_PATH; do
            [[ "${!path}" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Protected deployment path is not canonical."; exit 1; }
          done
          [[ "$KNOWN_HOSTS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RUNNER_ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -f "$DEPLOY_KEY_PATH"
          test "$(stat -c '%a' "$DEPLOY_KEY_PATH")" = "600"
          test "$(sha256sum "$KNOWN_HOSTS_PATH" | awk '{print $1}')" = "$KNOWN_HOSTS_SHA256"
          test "$(sha256sum "$RUNNER_ATTESTATION_PATH" | awk '{print $1}')" = "$RUNNER_ATTESTATION_SHA256"
          ssh-keygen -F "$DEPLOY_HOST" -f "$KNOWN_HOSTS_PATH" >/dev/null

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: "${{ inputs.release_sha }}"
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Build exact K-SNS artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.release_sha }}"
          test -z "$(git status --porcelain)"
          npm ci
          npm test
          npm run lint
          npm run build
          npm run verify:auth
          npm run verify:public-bff

      - name: Verify protected K-SNS custody metadata
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$DEPLOY_KEY_PATH" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_PATH")
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          "${SSH[@]}" "$REMOTE" "REMOTE_ENV_PATH='$REMOTE_ENV_PATH' SYSTEMD_UNIT='$SYSTEMD_UNIT' bash -s" <<'REMOTE_CUSTODY'
          set -euo pipefail

          credential_loaded() {
            local name="$1"
            local load
            load=$(systemctl show "$SYSTEMD_UNIT" --property=LoadCredentialEncrypted --value)
            if grep -q "$name" <<<"$load"; then
              return 0
            fi
            grep -Fq '[unprintable]' <<<"$load" || return 1
            grep -Eq "^LoadCredentialEncrypted=${name}(:|$)" < <(systemctl cat "$SYSTEMD_UNIT")
          }

          test -f "$REMOTE_ENV_PATH"
          test ! -L "$REMOTE_ENV_PATH"
          test "$(stat -c '%a' "$REMOTE_ENV_PATH")" = 600
          for key in K_SNS_AUTH_RUNTIME KARIYA_SNS_PUBLIC_ORIGIN K_SNS_TRANSACTION_KEK_ID K_SNS_TRANSACTION_KEK_CURRENT_VERSION K_SNS_TRANSACTION_KEK_PREVIOUS_VERSION K_SNS_CLOUD_MTLS_TRANSPORT_ORIGIN K_SNS_CLOUD_MTLS_SERVER_NAME; do
            grep -q "^$key=" "$REMOTE_ENV_PATH" || exit 1
          done
          ! grep -Eq '^(K_SNS_TRANSACTION_KMS_KEY_RESOURCE|K_SNS_GCP_WIF_CONFIG_PATH|GOOGLE_APPLICATION_CREDENTIALS)=' "$REMOTE_ENV_PATH"
          for credential in ksns-transaction-kek-current ksns-db-url ksns-db-ca.pem cloud-client-cert.pem cloud-client-key.pem cloud-ca-bundle.pem cloud-crl.pem; do
            credential_loaded "$credential"
            path="/etc/credstore.encrypted/$credential"
            test -f "$path"
            test ! -L "$path"
            test "$(stat -c '%U:%G:%a' "$path")" = root:root:600
          done
          PREVIOUS_VERSION=$(sed -n 's/^K_SNS_TRANSACTION_KEK_PREVIOUS_VERSION=//p' "$REMOTE_ENV_PATH")
          if test -n "$PREVIOUS_VERSION"; then
            credential_loaded ksns-transaction-kek-previous
            PREVIOUS=/etc/credstore.encrypted/ksns-transaction-kek-previous
            test -f "$PREVIOUS"
            test ! -L "$PREVIOUS"
            test "$(stat -c '%U:%G:%a' "$PREVIOUS")" = root:root:600
          fi
          REMOTE_CUSTODY

      - name: Stage and verify immutable K-SNS systemd release
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$DEPLOY_KEY_PATH" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_PATH")
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          SHA="${{ inputs.release_sha }}"
          RELEASE_DIR="$SERVICE_PATH/.release-staging/$SHA"
          ROLLBACK_FILE="$SERVICE_PATH/.release-state/sns-$SHA.rollback"

          "${SSH[@]}" "$REMOTE" "set -eu; umask 077; mkdir -p '$RELEASE_DIR' '$SERVICE_PATH/.release-state'"
          rsync -az --delete --exclude='.git' --exclude='.env*' --exclude='node_modules' -e "ssh -i $DEPLOY_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_PATH" ./ "$REMOTE:$RELEASE_DIR/"
          if ! "${SSH[@]}" "$REMOTE" "SERVICE_PATH='$SERVICE_PATH' RELEASE_DIR='$RELEASE_DIR' ROLLBACK_FILE='$ROLLBACK_FILE' SHA='$SHA' SYSTEMD_UNIT='$SYSTEMD_UNIT' REMOTE_ENV_PATH='$REMOTE_ENV_PATH' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          test -f "$RELEASE_DIR/.next/standalone/server.js"
          printf '%s\n' "$SHA" > "$RELEASE_DIR/REVISION"
          chmod 0644 "$RELEASE_DIR/REVISION"
          previous_release=$(readlink -f "$SERVICE_PATH/current" 2>/dev/null || true)
          printf '%s\n' "$previous_release" > "$ROLLBACK_FILE"
          chmod 600 "$ROLLBACK_FILE"
          find "$RELEASE_DIR" -type d -exec chmod go-w {} +
          find "$RELEASE_DIR" -type f -exec chmod go-w {} +
          ln -sfn "$RELEASE_DIR" "$SERVICE_PATH/current.next"
          mv -Tf "$SERVICE_PATH/current.next" "$SERVICE_PATH/current"
          systemctl restart "$SYSTEMD_UNIT"
          test "$(systemctl is-active "$SYSTEMD_UNIT")" = active
          test "$(readlink -f "$SERVICE_PATH/current")" = "$RELEASE_DIR"
          test "$(cat "$SERVICE_PATH/current/REVISION")" = "$SHA"
          app_user=$(systemctl show "$SYSTEMD_UNIT" --property=User --value)
          test -n "$app_user"
          test "$app_user" != root
          PORT=$(sed -n 's/^PORT=//p' "$REMOTE_ENV_PATH" | tail -n 1)
          case "$PORT" in ''|*[!0-9]*) PORT=3010 ;; esac
          PORT="$PORT" node -e "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
          REMOTE_DEPLOY
          then
          "${SSH[@]}" "$REMOTE" "SERVICE_PATH='$SERVICE_PATH' ROLLBACK_FILE='$ROLLBACK_FILE' SYSTEMD_UNIT='$SYSTEMD_UNIT' bash -s" <<'REMOTE_ROLLBACK'
          set -euo pipefail
          previous_release=$(cat "$ROLLBACK_FILE")
          test -n "$previous_release"
          test -d "$previous_release"
          ln -sfn "$previous_release" "$SERVICE_PATH/current.next"
          mv -Tf "$SERVICE_PATH/current.next" "$SERVICE_PATH/current"
          systemctl restart "$SYSTEMD_UNIT"
          test "$(systemctl is-active "$SYSTEMD_UNIT")" = active
          REMOTE_ROLLBACK
            echo "Immutable K-SNS deploy failed; prior systemd release restored."
            exit 1
          fi

          if ! "${SSH[@]}" "$REMOTE" "SERVICE_PATH='$SERVICE_PATH' ROLLBACK_FILE='$ROLLBACK_FILE' SYSTEMD_UNIT='$SYSTEMD_UNIT' REMOTE_ENV_PATH='$REMOTE_ENV_PATH' bash -s" <<'REMOTE_VERIFY'
          set -euo pipefail
          test "$(systemctl is-active "$SYSTEMD_UNIT")" = active
          PORT=$(sed -n 's/^PORT=//p' "$REMOTE_ENV_PATH" | tail -n 1)
          case "$PORT" in ''|*[!0-9]*) PORT=3010 ;; esac
          PORT="$PORT" node -e "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
          REMOTE_VERIFY
          then
          "${SSH[@]}" "$REMOTE" "SERVICE_PATH='$SERVICE_PATH' ROLLBACK_FILE='$ROLLBACK_FILE' SYSTEMD_UNIT='$SYSTEMD_UNIT' bash -s" <<'REMOTE_ROLLBACK'
          set -euo pipefail
          previous_release=$(cat "$ROLLBACK_FILE")
          test -n "$previous_release"
          test -d "$previous_release"
          ln -sfn "$previous_release" "$SERVICE_PATH/current.next"
          mv -Tf "$SERVICE_PATH/current.next" "$SERVICE_PATH/current"
          systemctl restart "$SYSTEMD_UNIT"
          test "$(systemctl is-active "$SYSTEMD_UNIT")" = active
          REMOTE_ROLLBACK
            echo "Immutable K-SNS health failed; prior systemd release restored."
            exit 1
          fi
